<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decode QR — Runtime Terror</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/form.css') }}">
</head>
<body>

<nav class="topnav">
    <a class="nav-logo" href="/">RUNTIME<span>TERROR</span></a>
    <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/form">Encode</a></li>
        <li><a href="/upload" class="active">Decode</a></li>
        <li><a href="/suggestion">Feedback</a></li>
        <li><a href="/about">Team</a></li>
        
    </ul>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
</nav>

<div class="page-wrap">
    <h1 class="section-heading">DECODE <span>QR</span></h1>
    <p class="section-sub">Extract data from a QR image</p>

    <form class="form-wrap" method="POST" action="/upload" enctype="multipart/form-data">
        <div class="form-group">
            <label class="form-label" for="qr_file">QR Image <span class="required">*</span></label>
            <input type="file" id="qr_file" name="qr_file" accept="image/*" required>
            <p class="form-hint">Supported: PNG, JPG, GIF, BMP, WEBP</p>
        </div>

        <button type="submit" class="btn btn-solid">&#8686; &nbsp;Decode</button>
    </form>

    {% if results %}
    <div class="result-box">
        <strong>Decoded content</strong>
        {% for r in results %}
            <pre>{{ r }}</pre>
        {% endfor %}
    </div>
    {% endif %}

    {% if error %}
    <div class="error-box">&#9888; &nbsp;{{ error }}</div>
    {% endif %}
</div>

<script>
    document.getElementById('navToggle').addEventListener('click', function () {
        document.getElementById('navLinks').classList.toggle('open');
    });
</script>
</body>
</html>
