<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback — Runtime Terror</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/form.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/suggestion.css') }}">
</head>
<body>

<nav class="topnav">
    <a class="nav-logo" href="/">RUNTIME<span>TERROR</span></a>
    <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/form">Encode</a></li>
        <li><a href="/upload">Decode</a></li>
        <li><a href="/suggestion" class="active">Feedback</a></li>
        <li><a href="/about">Team</a></li>
        
    </ul>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
</nav>

<div class="page-wrap">

{% if thankyou %}
<div class="thankyou-wrap">
    <div class="thankyou-icon">&#10003;</div>
    <div class="thankyou-title">FEEDBACK RECEIVED</div>
    <p class="thankyou-sub">Thanks for taking the time. We read every response.</p>
    <a href="/" class="btn" style="margin-top:8px;">&#8592; Back to Home</a>
</div>

{% else %}

<h1 class="section-heading">YOUR <span>FEEDBACK</span></h1>
<p class="section-sub">Liked something? Hated something? Tell us.</p>

<form class="form-wrap" method="POST" action="/suggestion">

    <div class="form-group">
        <label class="form-label" for="name">Your name <span class="optional">(optional)</span></label>
        <input type="text" id="name" name="name" placeholder="Anonymous" autocomplete="off">
    </div>

    <div class="rating-wrap">
        <span class="rating-label">Rating</span>
        <fieldset class="rating">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="Excellent">&#9733;</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="Good">&#9733;</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="Okay">&#9733;</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="Bad">&#9733;</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="Terrible">&#9733;</label>
        </fieldset>
    </div>

    <div class="form-group" style="margin-top: 20px;">
        <label class="form-label" for="feedback">Your thoughts <span class="required">*</span></label>
        <textarea id="feedback" name="feedback" placeholder="Write your feedback here..." rows="8" required></textarea>
    </div>

    <button type="submit" class="btn btn-solid">&#9654; &nbsp;Submit Feedback</button>
</form>

{% endif %}

</div>

<script>
    document.getElementById('navToggle').addEventListener('click', function () {
        document.getElementById('navLinks').classList.toggle('open');
    });
</script>
</body>
</html>
