<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your QR Code — Runtime Terror</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
    <style>
        .qr-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            padding-top: 24px;
            text-align: center;
        }
        .qr-img-wrap {
            padding: 20px;
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: 0 0 60px rgba(0,229,200,0.15);
            animation: fadeUp 0.5s ease both;
        }
        .qr-img-wrap img {
            display: block;
            max-width: 280px;
            width: 100%;
        }
        .qr-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeUp 0.5s 0.15s ease both;
        }
        /* ── Google Lens tip ─────────────────────────── */
        .lens-tip {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(245, 166, 35, 0.07);
            border: 1px solid rgba(245, 166, 35, 0.3);
            border-radius: var(--radius);
            max-width: 360px;
            animation: fadeUp 0.5s 0.25s ease both;
        }
        .lens-tip-icon { font-size: 20px; flex-shrink: 0; }
        .lens-tip-text {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            color: var(--accent2);
            line-height: 1.6;
            text-align: left;
        }
        .lens-tip-text strong {
            display: block;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<nav class="topnav">
    <a class="nav-logo" href="/">RUNTIME<span>TERROR</span></a>
    <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/form" class="active">Encode</a></li>
        <li><a href="/upload">Decode</a></li>
        <li><a href="/suggestion">Feedback</a></li>
        <li><a href="/about">Team</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
</nav>

<div class="page-wrap">
    <div class="qr-view">
        <h1 class="section-heading" style="margin-bottom:0">QR <span>READY</span></h1>

        <div class="qr-img-wrap">
            <img src="data:image/png;base64,{{ qr_b64 }}" alt="Generated QR Code">
        </div>

        <div class="qr-actions">
            <!-- data URL download — no file stored on server -->
            <a class="btn btn-solid"
               href="data:image/png;base64,{{ qr_b64 }}"
               download="{{ fname }}.png">
                &#8681; &nbsp;Download PNG
            </a>
            <a href="/form" class="btn">&#8592; &nbsp;Encode Another</a>
        </div>

        <div class="lens-tip">
            <span class="lens-tip-icon">&#128269;</span>
            <div class="lens-tip-text">
                <strong>Pro Tip</strong>
                For best results on mobile, scan with <strong>Google Lens</strong> — it handles styled &amp; coloured QR codes better than the default camera app.
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('navToggle').addEventListener('click', function () {
        document.getElementById('navLinks').classList.toggle('open');
    });
</script>
</body>
</html>
